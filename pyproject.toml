[project]
name = "sequential-thinking"
version = "0.5.0"
description = "A Sequential Thinking MCP Server for advanced problem solving"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "ai", "problem-solving", "sequential-thinking"]
authors = [
   { name = "Arben Ademi", email = "arben.ademi@tuta.io" }
]
dependencies = [
   "mcp[cli]>=1.2.0",
   "pydantic>=2.0.0",
   "rich>=13.7.0",
   "pyyaml>=6.0",
   "portalocker",
]

[project.scripts]
mcp-sequential-thinking = "mcp_sequential_thinking.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "basedpyright>=1.21.0",
]

vis = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
]

web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

all = [
    "sequential-thinking[dev,vis,web]",
]

[project.urls]
Source = "https://github.com/arben-adm/sequential-thinking"

[tool.hatch.build.targets.wheel]
packages = ["mcp_sequential_thinking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.basedpyright]
include = ["mcp_sequential_thinking", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

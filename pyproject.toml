[project]
name = "sequential-thinking"
version = "0.5.0"
description = "A Sequential Thinking MCP Server for advanced problem solving"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "ai", "problem-solving", "sequential-thinking"]
authors = [
   { name = "Arben Ademi", email = "arben.ademi@tuta.io" }
]
dependencies = [
   "mcp>=1.27.1",
   "pydantic>=2.13.4",
   "portalocker>=3.2.0",
]

[project.scripts]
mcp-sequential-thinking = "mcp_sequential_thinking.server:main"

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "type" },
]

test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

lint = [
    "ruff>=0.15.12",
]

type = [
    "basedpyright>=1.39.4",
]

[project.urls]
Source = "https://github.com/arben-adm/sequential-thinking"

[tool.hatch.build.targets.wheel]
packages = ["mcp_sequential_thinking"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
xfail_strict = true
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "--cov=mcp_sequential_thinking",
    "--cov-report=term-missing",
    "--cov-branch",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Keep process_thought's list defaults because they produce simple MCP tool schemas.
"mcp_sequential_thinking/server.py" = ["B006"]

[tool.coverage.run]
source = ["mcp_sequential_thinking"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
skip_empty = true
fail_under = 80

[tool.basedpyright]
include = ["mcp_sequential_thinking", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
